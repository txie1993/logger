<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap Log</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #3b3b3b;
    --accent-hover: #000000;
    --border: #e5e5e5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a;
      --card: #232426;
      --text: #f0f0f0;
      --muted: #a0a0a0;
      --accent: #e5e5e5;
      --accent-hover: #ffffff;
      --border: #35363a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181a;
    --card: #232426;
    --text: #f0f0f0;
    --muted: #a0a0a0;
    --accent: #e5e5e5;
    --accent-hover: #ffffff;
    --border: #35363a;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
    padding: 24px 20px 40px;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    text-align: center;
    margin: 8px 0 24px;
  }
  .note-input {
    display: block;
    width: 100%;
    padding: 14px 16px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    outline: none;
  }
  .note-input:focus {
    border-color: var(--accent);
  }
  .tap-btn {
    display: block;
    width: 100%;
    padding: 22px;
    font-size: 1.1rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .tap-btn:hover { background: var(--accent-hover); }
  .tap-btn:active { transform: scale(0.97); }

  .count-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 20px 0 8px;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .clear-btn {
    background: none;
    border: none;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
    font-size: 0.85rem;
    padding: 4px;
  }
  .clear-btn:hover { color: var(--text); }

  .log {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .log-entry {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 0.95rem;
  }
  .log-entry:last-child { border-bottom: none; }
  .log-entry .entry-top {
    display: flex;
    justify-content: space-between;
  }
  .log-entry .idx {
    color: var(--muted);
    margin-right: 10px;
    min-width: 24px;
  }
  .log-entry .note {
    display: block;
    margin-top: 4px;
    margin-left: 34px;
    color: var(--muted);
    font-size: 0.88rem;
    word-break: break-word;
  }
  .empty {
    padding: 24px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .max-w {
    overflow-x: auto;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Tap to Log Time</h1>
    <input type="text" class="note-input" id="noteInput" placeholder="Add a note (optional)" maxlength="200">
    <button class="tap-btn" id="tapBtn">Tap</button>
    <div class="count-row">
      <span id="countLabel">0 entries</span>
      <button class="clear-btn" id="clearBtn">Clear log</button>
    </div>
    <div class="log max-w" id="log"></div>
  </div>

<script>
(function () {
  var STORAGE_KEY = 'tap-log-entries';
  var entries = [];

  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) entries = JSON.parse(raw);
  } catch (e) {
    entries = [];
  }

  var btn = document.getElementById('tapBtn');
  var clearBtn = document.getElementById('clearBtn');
  var logEl = document.getElementById('log');
  var countLabel = document.getElementById('countLabel');
  var noteInput = document.getElementById('noteInput');

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    } catch (e) {
      // storage unavailable; entries still render for this session
    }
  }

  function render() {
    countLabel.textContent = entries.length + (entries.length === 1 ? ' entry' : ' entries');
    if (entries.length === 0) {
      logEl.innerHTML = '<div class="empty">No taps yet — tap the button above.</div>';
      return;
    }
    var html = '';
    for (var i = entries.length - 1; i >= 0; i--) {
      var e = entries[i];
      var noteHtml = e.note ? '<span class="note">' + escapeHtml(e.note) + '</span>' : '';
      html += '<div class="log-entry">' +
                '<div class="entry-top"><span><span class="idx">' + (i + 1) + '.</span>' + e.label + '</span></div>' +
                noteHtml +
              '</div>';
    }
    logEl.innerHTML = html;
  }

  function formatNow() {
    var d = new Date();
    return d.toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
  }

  function logTap() {
    var note = noteInput.value.trim();
    entries.push({ ts: Date.now(), label: formatNow(), note: note });
    save();
    render();
    noteInput.value = '';
    noteInput.focus();
  }

  btn.addEventListener('click', logTap);
  noteInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') logTap();
  });

  clearBtn.addEventListener('click', function () {
    if (entries.length === 0) return;
    if (confirm('Clear all logged times?')) {
      entries = [];
      save();
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
