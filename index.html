<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap Log</title>
<style>
  :root {
    --bg: #bfe4fb;
    --card: #eaf6fe;
    --text: #16344a;
    --muted: #4c7893;
    --accent: #4fa8e0;
    --accent-hover: #3690cc;
    --border: #a3d3f2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f2436;
      --card: #163348;
      --text: #dcf0fb;
      --muted: #7fb1d3;
      --accent: #4fa8e0;
      --accent-hover: #6dbdf0;
      --border: #274a63;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f2436;
    --card: #163348;
    --text: #dcf0fb;
    --muted: #7fb1d3;
    --accent: #4fa8e0;
    --accent-hover: #6dbdf0;
    --border: #274a63;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
    padding: 24px 20px 40px;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    text-align: center;
    margin: 8px 0 24px;
  }
  .note-input {
    display: block;
    width: 100%;
    padding: 14px 16px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    outline: none;
  }
  .note-input:focus { border-color: var(--accent); }
  .tap-btn {
    display: block;
    width: 100%;
    padding: 22px;
    font-size: 1.1rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .tap-btn:disabled { opacity: 0.6; cursor: default; }
  .tap-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .tap-btn:active:not(:disabled) { transform: scale(0.97); }

  .status-row {
    margin: 16px 0 6px;
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
  }

  .latest {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 18px;
    text-align: center;
  }
  .latest .time {
    font-size: 1.25rem;
    font-weight: 600;
  }
  .latest .note {
    display: block;
    margin-top: 8px;
    color: var(--muted);
    font-size: 0.95rem;
    word-break: break-word;
  }
  .latest .empty {
    color: var(--muted);
    font-size: 0.95rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Tap to Log Time</h1>
    <input type="text" class="note-input" id="noteInput" placeholder="Add a note (optional)" maxlength="200">
    <button class="tap-btn" id="tapBtn" disabled>Tap</button>
    <div class="status-row" id="statusRow">Loading…</div>
    <div class="latest" id="latest"><span class="empty">No taps yet — tap the button above.</span></div>
  </div>

<script>
(function () {
  // jsonbin.io config
  var BIN_ID = '6ab76996ac6210605af6e491';
  var API_KEY = '$2a$10$gp0onSov6I4D3P3KMtPEpuNp9eRZgpLNgAGC6eKhZOYrrAZwleQZG';
  var BASE_URL = 'https://api.jsonbin.io/v3/b/' + BIN_ID;

  var LOCAL_KEY = 'tap-log-latest';
  var btn = document.getElementById('tapBtn');
  var latestEl = document.getElementById('latest');
  var statusRow = document.getElementById('statusRow');
  var noteInput = document.getElementById('noteInput');

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatNow() {
    var d = new Date();
    return d.toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
  }

  function renderLatest(data) {
    if (!data || !data.label) {
      latestEl.innerHTML = '<span class="empty">No taps yet — tap the button above.</span>';
      return;
    }
    var noteHtml = data.note ? '<span class="note">' + escapeHtml(data.note) + '</span>' : '';
    latestEl.innerHTML = '<div class="time">' + escapeHtml(data.label) + '</div>' + noteHtml;
  }

  function saveLocal(data) {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function loadLocal() {
    try {
      var raw = localStorage.getItem(LOCAL_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function fetchLatest() {
    return fetch(BASE_URL + '/latest', {
      headers: { 'X-Master-Key': API_KEY }
    })
      .then(function (res) {
        if (!res.ok) throw new Error('fetch failed');
        return res.json();
      })
      .then(function (json) {
        return json && json.record ? json.record : null;
      });
  }

  function pushLatest(data) {
    return fetch(BASE_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': API_KEY
      },
      body: JSON.stringify(data)
    }).then(function (res) {
      if (!res.ok) throw new Error('write failed');
      return data;
    });
  }

  function logTap() {
    var note = noteInput.value.trim();
    var data = { ts: Date.now(), label: formatNow(), note: note };

    // optimistic UI update
    renderLatest(data);
    noteInput.value = '';
    noteInput.focus();

    pushLatest(data)
      .then(function () {
        saveLocal(data);
        statusRow.textContent = 'Synced across devices';
      })
      .catch(function () {
        saveLocal(data);
        statusRow.textContent = 'Saved on this device only (sync failed)';
      });
  }

  btn.addEventListener('click', logTap);
  noteInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') logTap();
  });

  fetchLatest()
    .then(function (data) {
      renderLatest(data);
      statusRow.textContent = 'Synced across devices';
      btn.disabled = false;
    })
    .catch(function () {
      renderLatest(loadLocal());
      statusRow.textContent = 'Offline — showing last known local value';
      btn.disabled = false;
    });
})();
</script>
</body>
</html>
